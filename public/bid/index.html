<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bid invitation · Sitely</title><style>
body{margin:0;background:#f6f3ed;color:#26211a;font:15px system-ui,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:36px 20px}.brand{font-weight:700;font-size:13px;letter-spacing:.15em;color:#a64b24}.card{margin-top:24px;background:#fff;border:1px solid #d9d2c4;border-radius:14px;padding:24px}h1{font:700 30px Georgia,serif;margin:8px 0}.meta{color:#6f675c}.scope{white-space:pre-wrap;line-height:1.55;margin:22px 0}.file{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid #e5dfd4}.file a{color:#a64b24;font-weight:700}.empty,.err{padding:24px 0;color:#6f675c}@media(max-width:600px){.wrap{padding:24px 14px}.card{padding:18px}}
</style></head><body><main class="wrap"><div class="brand">SITELY · BID INVITATION</div><div id="app" class="card"><div class="empty">Loading invitation…</div></div></main><script>
(async()=>{const app=document.getElementById('app'),p=location.pathname.split('/').filter(Boolean).slice(1),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(p.length<3){app.innerHTML='<div class="err">This invitation link is incomplete.</div>';return}try{const r=await fetch('/api/bid/'+p.map(encodeURIComponent).join('/'));if(!r.ok)throw new Error();const d=await r.json(),q=d.request||{},base='/api/bid/'+p.map(encodeURIComponent).join('/');app.innerHTML='<div class="meta">'+esc(d.job&&d.job.name)+'</div><h1>'+esc(q.title||'Request for bid')+'</h1>'+(q.dueDate?'<div class="meta">Bid due: '+esc(q.dueDate)+'</div>':'')+'<div class="scope">'+esc(q.scope)+'</div><h2>Plans and documents</h2>'+((d.plans||[]).length?d.plans.map(f=>'<div class="file"><span>'+esc(f.name)+'</span><a href="'+base+'/files/'+encodeURIComponent(f.id)+'">Open</a></div>').join(''):'<div class="empty">No files were included.</div>')+'<p class="meta">Please email your estimate to '+esc(q.returnEmail||'the sender')+'.</p>'}catch(e){app.innerHTML='<div class="err">This invitation is unavailable or the link is invalid.</div>'}})();
</script></body></html>
