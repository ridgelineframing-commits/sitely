<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign — Sitely</title>
<link rel="icon" href="/sitely-192.png">
<style>
  :root{
    --bg:#F6F3ED; --sf:#FDFBF7; --tx:#26211A; --mu:#7A6F60; --ln:#D9D2C4; --ac:#A64B24; --ok:#3F7D5B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto;padding:26px 20px 80px 20px;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 0 20px 0;}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,#4C7BF6,#1E44BE);display:flex;align-items:center;justify-content:center;}
  .mark svg{display:block;}
  .brand b{font-size:15px;letter-spacing:-0.3px;}
  .card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px 24px;margin-bottom:16px;}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:26px;margin:0 0 4px 0;letter-spacing:-0.01em;}
  .sub{color:var(--mu);font-size:13.5px;margin-bottom:18px;}
  .lbl{font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--mu);text-transform:uppercase;margin-bottom:5px;}
  .amt{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;}
  .scope{white-space:pre-wrap;font-size:14px;border-top:1px solid var(--ln);padding-top:14px;margin-top:14px;}
  input[type=text]{width:100%;border:1px solid var(--ln);border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--tx);}
  canvas{width:100%;height:170px;border:1px solid var(--ln);border-radius:10px;background:#FFFFFF;touch-action:none;cursor:crosshair;display:block;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  button{font-family:inherit;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;padding:12px 20px;border:1.5px solid var(--tx);background:transparent;color:var(--tx);}
  button.primary{background:var(--tx);color:var(--bg);border-color:var(--tx);}
  button.primary:disabled{opacity:0.4;cursor:not-allowed;}
  button.link{border:none;background:none;color:var(--mu);font-weight:600;padding:6px 2px;text-decoration:underline;}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--tx);margin:16px 0;cursor:pointer;}
  .consent input{margin-top:3px;width:17px;height:17px;accent-color:var(--ac);flex:0 0 17px;}
  .err{color:#B0392E;font-size:13px;font-weight:600;margin-top:10px;}
  .done{border-color:var(--ok);}
  .done .tick{color:var(--ok);font-size:30px;}
  .fine{font-size:11.5px;color:var(--mu);margin-top:14px;}
  @media print{ .no-print{display:none !important;} body{background:#fff;} .card{border:none;background:#fff;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mark"><svg width="20" height="20" viewBox="0 0 512 512"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M96 300 L256 168 L416 300" stroke-width="52"/><path d="M150 356 L256 268 L362 356" stroke-width="34" stroke-opacity="0.6"/></g></svg></span>
    <b>sitely</b>
  </div>
  <div id="app"><div class="card">Loading your document…</div></div>
</div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var token = location.pathname.replace(/^\/sign\/?/, '').replace(/\/$/, '');
  var doc = null, pad = null, drew = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) {
    if (n == null) return '';
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function kindLabel(k) {
    return k === 'change_order' ? 'Change order' : (k === 'draw' ? 'Draw request' : 'Contract');
  }
  // The hash of exactly what we showed you — sent along with the signature so the record
  // can prove later that this text is the text that was signed.
  function sha256Hex(str) {
    var bytes = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }
  function docText(d) {
    return [kindLabel(d.kind), d.jobName, d.title, d.amount == null ? '' : String(d.amount), d.summary].join('\n');
  }

  function load() {
    fetch('/api/sign/' + encodeURIComponent(token))
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { app.innerHTML = '<div class="card"><h1>Link not valid</h1><div class="sub">' + esc(res.j.error || 'This signing link has expired.') + '</div></div>'; return; }
        doc = res.j;
        render();
      })
      .catch(function () { app.innerHTML = '<div class="card"><h1>Offline</h1><div class="sub">We couldn’t reach Sitely. Check your connection and reload.</div></div>'; });
  }

  function signedCard() {
    return '<div class="card done">' +
      '<div class="tick">✓</div>' +
      '<h1>Signed — thank you</h1>' +
      '<div class="sub">' + esc(doc.typedName || '') + ' signed this on ' + esc(new Date(doc.signedAt).toLocaleString()) + '.</div>' +
      '<div class="fine">Keep this page for your records, or print it. A copy is on file with your contractor.</div>' +
      '<div class="row no-print" style="margin-top:16px;"><button onclick="window.print()">Print this page</button></div></div>';
  }

  function render() {
    if (doc.status === 'signed') { app.innerHTML = summaryCard() + signedCard(); return; }
    if (doc.status === 'declined') { app.innerHTML = summaryCard() + '<div class="card"><h1>Declined</h1><div class="sub">You declined this document. Your contractor has been notified.</div></div>'; return; }
    if (doc.status === 'voided') { app.innerHTML = '<div class="card"><h1>Withdrawn</h1><div class="sub">Your contractor withdrew this document.</div></div>'; return; }
    app.innerHTML = summaryCard() + signForm();
    wirePad();
  }

  function summaryCard() {
    return '<div class="card">' +
      '<div class="lbl">' + esc(kindLabel(doc.kind)) + (doc.jobName ? ' · ' + esc(doc.jobName) : '') + '</div>' +
      '<h1>' + esc(doc.title || kindLabel(doc.kind)) + '</h1>' +
      (doc.amount != null ? '<div class="amt">' + esc(money(doc.amount)) + '</div>' : '') +
      (doc.summary ? '<div class="scope">' + esc(doc.summary) + '</div>' : '') +
      '</div>';
  }

  function signForm() {
    return '<div class="card no-print">' +
      '<div class="lbl">Your full name</div>' +
      '<input type="text" id="typed" autocomplete="name" value="' + esc(doc.signerName || '') + '" placeholder="Type your name">' +
      '<div class="lbl" style="margin-top:18px;">Draw your signature</div>' +
      '<canvas id="pad"></canvas>' +
      '<div class="row" style="margin-top:8px;"><button class="link" id="clear">Clear</button></div>' +
      '<label class="consent"><input type="checkbox" id="consent">' +
      '<span>I agree to sign electronically, and I understand my electronic signature is as binding as a signature on paper. I have read what’s above and it reflects what I agreed to.</span></label>' +
      '<div class="row"><button class="primary" id="submit" disabled>Sign it</button>' +
      '<button class="link" id="decline">I have a question / decline</button></div>' +
      '<div id="err" class="err" style="display:none;"></div>' +
      '<div class="fine">Signed ' + esc(new Date().toLocaleDateString()) + ' · we record the date, time and device you signed from as part of the record.</div>' +
      '</div>';
  }

  function wirePad() {
    var canvas = document.getElementById('pad');
    var ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1B1712';
    pad = canvas;
    var drawing = false;
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    canvas.addEventListener('pointerdown', function (e) {
      drawing = true; drew = true; canvas.setPointerCapture(e.pointerId);
      var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); refresh();
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    canvas.addEventListener('pointerup', function () { drawing = false; });
    canvas.addEventListener('pointercancel', function () { drawing = false; });

    document.getElementById('clear').onclick = function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height); drew = false; refresh();
    };
    document.getElementById('typed').oninput = refresh;
    document.getElementById('consent').onchange = refresh;
    document.getElementById('submit').onclick = submit;
    document.getElementById('decline').onclick = decline;
    refresh();
  }

  function refresh() {
    var name = (document.getElementById('typed').value || '').trim();
    var ok = name.length >= 2 && drew && document.getElementById('consent').checked;
    document.getElementById('submit').disabled = !ok;
  }

  function showErr(msg) {
    var e = document.getElementById('err');
    e.textContent = msg; e.style.display = 'block';
  }

  function submit() {
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Signing…';
    sha256Hex(docText(doc)).then(function (hash) {
      return fetch('/api/sign/' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          typedName: document.getElementById('typed').value,
          signatureImage: pad.toDataURL('image/png'),
          consent: true,
          docHash: hash
        })
      });
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) { btn.disabled = false; btn.textContent = 'Sign it'; showErr(res.j.error || 'Could not sign. Try again.'); return; }
      doc.status = 'signed';
      doc.signedAt = res.j.signedAt || new Date().toISOString();
      doc.typedName = document.getElementById('typed').value.trim();
      render();
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Sign it';
      showErr('We couldn’t reach Sitely. Check your connection and try again.');
    });
  }

  function decline() {
    var reason = window.prompt('Tell your contractor what needs to change (optional):') || '';
    fetch('/api/sign/' + encodeURIComponent(token) + '/decline', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reason })
    }).then(function () { doc.status = 'declined'; render(); });
  }

  if (!token) {
    app.innerHTML = '<div class="card"><h1>Nothing to sign</h1><div class="sub">This link is missing its code. Use the link your contractor sent you.</div></div>';
  } else {
    load();
  }
})();
</script>
</body>
</html>
